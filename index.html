<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Segnapunti Briscola - Arcade Edition</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d30;
      --bg-input: #1e293b;
      --border: #334155;
      --border-focus: #475569;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --blue: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.4);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.4);
      --accent: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }

    .container {
      width: 100%;
      max-width: 650px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Header Bar */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg-card);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .logo span {
      color: var(--blue);
    }

    .stats-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-input);
      padding: 3px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-val {
      color: var(--blue);
      font-family: monospace;
      font-size: 0.95rem;
    }

    .btn-reset {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-reset:active {
      background: var(--border);
      color: #fff;
    }

    /* History Bar */
    .history-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .history-bar::-webkit-scrollbar {
      display: none;
    }

    .history-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      font-family: monospace;
      background: var(--bg-card);
      border: 1px solid var(--border);
      animation: popIn 0.25s ease;
      color: #fff;
      cursor: pointer;
      transition: all 0.15s;
    }

    .history-pill:active {
      transform: scale(0.94);
      background: rgba(225, 29, 72, 0.2);
      border-color: var(--accent);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--blue);
      box-shadow: 0 0 6px var(--blue);
    }

    .pill-carico .pill-dot {
      background-color: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    .pill-del {
      font-size: 0.7rem;
      color: var(--accent);
      margin-left: 2px;
      font-weight: 900;
    }

    /* Arena Display Punteggio */
    .arena-card {
      position: relative;
      flex: 1 1 0;
      min-height: 190px;
      background: radial-gradient(circle at center, #172544 0%, #0d1322 80%);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .arena-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .badge-target {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
      color: #fff;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .badge-target strong {
      color: var(--gold);
    }

    /* Punteggio Cubitale */
    .score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .score-number {
      font-size: 5rem;
      font-weight: 900;
      font-family: monospace;
      line-height: 0.95;
      letter-spacing: -2px;
      color: #fff;
      text-shadow: 0 0 25px rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }

    .score-number.winning {
      color: var(--green);
      text-shadow: 0 0 35px var(--green-glow);
      animation: pulseWin 1.2s infinite alternate;
    }

    .score-status {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    .score-status.winning {
      color: var(--green);
    }

    /* Progress Bar verso 61 */
    .progress-box {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 6px;
      transition: width 0.35s ease, background 0.3s;
      box-shadow: 0 0 10px var(--blue-glow);
    }

    .progress-fill.winning {
      background: linear-gradient(90deg, #10b981, #34d399);
      box-shadow: 0 0 12px var(--green-glow);
    }

    .progress-marker {
      position: absolute;
      left: 50.8%; /* 61 / 120 = 50.83% */
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
      z-index: 2;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--text-muted);
    }

    /* Griglia Carte / Pulsanti */
    .control-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .cards-row-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .cards-row-bottom {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .card-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .card-btn:active {
      transform: scale(0.95);
    }

    @media (hover: hover) {
      .card-btn:hover {
        background: #27354f;
        border-color: #475569;
        transform: translateY(-2px);
      }
    }

    .card-btn.carico {
      border-color: rgba(245, 158, 11, 0.4);
      background: linear-gradient(145deg, #1e293b, #1b263b);
    }

    .card-btn.carico:hover {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .card-btn-name {
      font-size: 0.92rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-btn-pts {
      font-size: 1.05rem;
      font-family: monospace;
      font-weight: 800;
      color: var(--blue);
    }

    .card-btn.carico .card-btn-pts {
      color: var(--gold);
    }

    .card-btn-count {
      font-size: 0.68rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      padding: 1px 6px;
      border-radius: 6px;
      margin-top: 2px;
    }

    .card-btn.full {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border);
    }

    /* Barra Azione Rapida Inferiore */
    .quick-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
    }

    .btn-undo {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-undo:active {
      background: var(--border);
      color: #fff;
    }

    .deck-info {
      font-size: 0.75rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--text-muted);
    }

    .deck-info span {
      color: var(--blue);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulseWin {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">
        🃏 <span>BRISCOLA</span> SCORE
      </div>
      <div class="stats-box">
        <span>Prese: <strong class="stat-val" id="cardsTaken">0</strong>/20</span>
        <span>Mancanti: <strong class="stat-val" id="pointsNeeded">61</strong></span>
        <button class="btn-reset" id="btnReset" title="Azzera punteggio">Nuova</button>
      </div>
    </header>

    <!-- History Bar (tap su un chip per rimuoverlo) -->
    <div class="history-bar" id="historyBar">
      <div class="history-pill"><span class="pill-dot"></span>In attesa...</div>
    </div>

    <!-- Arena Display Punteggio -->
    <div class="arena-card">
      <div class="arena-top">
        <span>Punteggio Squadra</span>
        <div class="badge-target">Vittoria: <strong>61 pt</strong></div>
      </div>

      <div class="score-center">
        <div class="score-number" id="scoreDisplay">0</div>
        <div class="score-status" id="scoreStatus">Mancano 61 punti</div>
      </div>

      <div class="progress-box">
        <div class="progress-track">
          <div class="progress-marker" title="Soglia 61 punti"></div>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-labels">
          <span>0</span>
          <span>61 (Target)</span>
          <span>120</span>
        </div>
      </div>
    </div>

    <!-- Controlli Selezione Carte -->
    <div class="control-card">
      <!-- Carichi (Asso e Tre) -->
      <div class="cards-row-top">
        <button class="card-btn carico" onclick="addCard('Asso', 11)">
          <span class="card-btn-name">Asso</span>
          <span class="card-btn-pts">+11 pt</span>
          <span class="card-btn-count" id="count-asso">0/4</span>
        </button>

        <button class="card-btn carico" onclick="addCard('Tre', 10)">
          <span class="card-btn-name">Tre</span>
          <span class="card-btn-pts">+10 pt</span>
          <span class="card-btn-count" id="count-tre">0/4</span>
        </button>
      </div>

      <!-- Figure (Re, Donna/Cavallo, Fante) -->
      <div class="cards-row-bottom">
        <button class="card-btn" onclick="addCard('Re', 4)">
          <span class="card-btn-name">Re</span>
          <span class="card-btn-pts">+4 pt</span>
          <span class="card-btn-count" id="count-re">0/4</span>
        </button>

        <button class="card-btn" onclick="addCard('Donna', 3)">
          <span class="card-btn-name">Donna</span>
          <span class="card-btn-pts">+3 pt</span>
          <span class="card-btn-count" id="count-donna">0/4</span>
        </button>

        <button class="card-btn" onclick="addCard('Fante', 2)">
          <span class="card-btn-name">Fante</span>
          <span class="card-btn-pts">+2 pt</span>
          <span class="card-btn-count" id="count-fante">0/4</span>
        </button>
      </div>

      <!-- Barra Azioni Rapide -->
      <div class="quick-actions">
        <button class="btn-undo" onclick="undoLastCard()">↩ Annulla Ultima</button>
        <div class="deck-info">Carte segnate: <span id="totalCardsCount">0</span>/20</div>
      </div>
    </div>
  </div>

  <script>
    // --- AUDIO SINTETIZZATO (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playCardSound(pts) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'triangle';
        const baseFreq = pts >= 10 ? 587.33 : pts >= 4 ? 440 : 349.23;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.3, now + 0.08);

        gain.gain.setValueAtTime(0.14, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.12);

        osc.start(now);
        osc.stop(now + 0.12);
      } catch (e) {}
    }

    function playWinSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.35);
        });
      } catch (e) {}
    }

    function playUndoSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.09);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch (e) {}
    }

    // --- LOGICA PUNTEGGIO ---
    let totalScore = 0;
    let cardCounts = {
      'Asso': 0,
      'Tre': 0,
      'Re': 0,
      'Donna': 0,
      'Fante': 0
    };
    let history = [];
    let hasWonOnce = false;

    // Riferimenti DOM
    const scoreDisplay = document.getElementById('scoreDisplay');
    const scoreStatus = document.getElementById('scoreStatus');
    const progressFill = document.getElementById('progressFill');
    const cardsTakenEl = document.getElementById('cardsTaken');
    const pointsNeededEl = document.getElementById('pointsNeeded');
    const totalCardsCountEl = document.getElementById('totalCardsCount');
    const historyBar = document.getElementById('historyBar');
    const btnReset = document.getElementById('btnReset');

    function addCard(name, pts) {
      if (cardCounts[name] >= 4) {
        // In un mazzo ci sono massimo 4 carte per tipo
        return;
      }

      initAudio();
      totalScore += pts;
      cardCounts[name]++;
      history.unshift({ name, pts });

      playCardSound(pts);

      if (totalScore >= 61 && !hasWonOnce) {
        hasWonOnce = true;
        playWinSound();
      }

      updateUI();
    }

    function removeCardAt(index) {
      initAudio();
      const item = history[index];
      if (!item) return;

      totalScore -= item.pts;
      cardCounts[item.name]--;
      history.splice(index, 1);

      if (totalScore < 61) {
        hasWonOnce = false;
      }

      playUndoSound();
      updateUI();
    }

    function undoLastCard() {
      if (history.length > 0) {
        removeCardAt(0);
      }
    }

    function updateUI() {
      // Punteggio & Status
      scoreDisplay.textContent = totalScore;

      const remaining = Math.max(0, 61 - totalScore);
      pointsNeededEl.textContent = remaining;

      if (totalScore >= 61) {
        scoreDisplay.classList.add('winning');
        scoreStatus.classList.add('winning');
        const surplus = totalScore - 61;
        scoreStatus.textContent = surplus === 0 ? "VITTORIA ESATTA (61 PT)!" : `VITTORIA! (+${surplus} PUNTI)`;
        progressFill.classList.add('winning');
      } else {
        scoreDisplay.classList.remove('winning');
        scoreStatus.classList.remove('winning');
        scoreStatus.textContent = `Mancano ${remaining} punti`;
        progressFill.classList.remove('winning');
      }

      // Progress bar (0 - 120 pt)
      const pct = Math.min(100, Math.max(0, (totalScore / 120) * 100));
      progressFill.style.width = `${pct}%`;

      // Conteggi carte
      let totalCards = 0;
      for (let k in cardCounts) {
        const count = cardCounts[k];
        totalCards += count;
        const el = document.getElementById(`count-${k.toLowerCase()}`);
        if (el) {
          el.textContent = `${count}/4`;
          const btn = el.closest('.card-btn');
          if (btn) {
            btn.classList.toggle('full', count >= 4);
          }
        }
      }

      cardsTakenEl.textContent = totalCards;
      totalCardsCountEl.textContent = totalCards;

      // History Bar
      if (history.length === 0) {
        historyBar.innerHTML = '<div class="history-pill"><span class="pill-dot"></span>In attesa...</div>';
      } else {
        historyBar.innerHTML = '';
        history.forEach((item, idx) => {
          const pill = document.createElement('div');
          pill.className = 'history-pill' + (item.pts >= 10 ? ' pill-carico' : '');
          pill.title = 'Tocca per rimuovere';
          pill.innerHTML = `
            <span class="pill-dot"></span>
            <span>${item.name} (+${item.pts})</span>
            <span class="pill-del">✕</span>
          `;
          pill.addEventListener('click', () => removeCardAt(idx));
          historyBar.appendChild(pill);
        });
      }
    }

    function reset() {
      if (history.length > 0) {
        if (!confirm("Vuoi azzerare il punteggio della partita?")) return;
      }
      totalScore = 0;
      cardCounts = { 'Asso': 0, 'Tre': 0, 'Re': 0, 'Donna': 0, 'Fante': 0 };
      history = [];
      hasWonOnce = false;
      updateUI();
    }

    btnReset.addEventListener('click', reset);

    // Scorciatoie tastiera da Mac (1=Asso, 2=Tre, 3=Re, 4=Donna, 5=Fante, Z=Undo)
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') addCard('Asso', 11);
      else if (e.key === '2') addCard('Tre', 10);
      else if (e.key === '3') addCard('Re', 4);
      else if (e.key === '4') addCard('Donna', 3);
      else if (e.key === '5') addCard('Fante', 2);
      else if (e.key === 'z' || e.key === 'Z') undoLastCard();
    });

    updateUI();
  </script>
</body>
</html>
